name: Validate docker-deploy-starter
description: Deliverable-specific checks; runtime and security policy live in starter-series/.github.
runs:
  using: composite
  steps:
  - name: Lint Dockerfile
    uses: starter-series/.github/.github/actions/docker-lint@fdacdbce9d1dd18a573e7c57c482bb07ab1f2954
  - name: Validate docker-compose
    run: |
      cp .env.example .env
      docker compose config --quiet
      rm .env
    shell: bash
  - name: Build Docker image
    run: docker build -t docker-deploy-starter:test .
    shell: bash
  - name: Scan image for vulnerabilities
    uses: starter-series/.github/.github/actions/image-security@fdacdbce9d1dd18a573e7c57c482bb07ab1f2954
    with:
      image: docker-deploy-starter:test
  - name: Check image size
    run: "SIZE=$(docker image inspect docker-deploy-starter:test --format='{{.Size}}')\nSIZE_MB=$((SIZE / 1024 /\
      \ 1024))\necho \"Image size: ${SIZE_MB} MB\"\nif [ \"$SIZE_MB\" -gt 500 ]; then\n  echo \"::error::Docker\
      \ image exceeds 500 MB (${SIZE_MB} MB) \u2014 consider multi-stage build\"\n  exit 1\nfi\n"
    shell: bash
  - name: Run rollback integration test
    run: bash tests/rollback-integration.sh
    shell: bash
    if: ${{ !cancelled() }}
  - name: Run JS tests
    run: npm test
    shell: bash
    if: ${{ !cancelled() }}
